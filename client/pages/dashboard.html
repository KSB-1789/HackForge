<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackForge - Dashboard</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel = "stylesheet" href = "../css/dashboard.css">
    <link rel = "stylesheet" href = "../css/style.css">
</head>
<body>
    <header class="topbar">
        <span class="brand">HackForge</span>
        <nav class="nav-links">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="team.html">Teams</a>
        </nav>
        <span class="user-info"></span>
        <button id = "logoutBtn">Logout</button>
    </header>

    <main class="main">
        <div class="page-header">
            <p class="eyebrow">DEVELOPER COLLABORATION PLATFORM</p>
            <h1>Dashboard</h1>
            <p class="subtitle">Create projects, organize tasks, and track progress with your teams.</p>
        </div>

        <section id = "projectsView">
            <div class="dash-grid">
                <div>
                    <h1 class="section-heading" id = "pFormHeading">Projects</h1>
                    <form id="dashForm">
                        <label for="name">Project Name</label>
                        <input id="name">

                        <label for="description">Description</label>
                        <input id="description">

                        <label for="team">Team</label>
                        <select id="team">
                            <option value="">Personal (no team)</option>
                        </select>
                        <label for="createdBy">Created By (email)</label>
                        <input id="createdBy" disabled>

                        <button type="submit" id = "projectSubmit">Create Project</button>
                        <div id="errorDiv"></div>
                    </form>
                </div>
                <div>
                    <div class="projects-toolbar">
                        <h2 class="projects-label">All projects</h2>
                        <button id="newProjectBtn">+ New Project</button>
                    </div>
                    <div id = "projectsContainer"></div>
                </div>
            </div>
        </section>

        <section id = "projectDetailsView" class = "hidden">
            <div class="detail-actions">
                <button id = "backBtn">Back to Projects</button>
                <a id = "collabBtn" href = "collaboration.html">Collaborate</a>
            </div>
            <div class="details-card">
                <h2 id="detailName"></h2>
                <p id="detailDescription"></p>
                <p id="detailTeam"></p>
                <p id="detailCreatedBy"></p>
            </div>
            <h3 id="taskHeading">Tasks</h3>
            <form id = "taskForm">
                <input id = "taskTitle" placeholder="Task Title">
                <input id = "taskDescription" placeholder="Task Description">
                <select id = "taskAssignee" placeholder="Assignee">
                    <option value="">Unassigned</option>
                </select>
                <select  id = "taskStatus">
                    <option value = "todo">todo</option>
                    <option value = "in-progress">in-progress</option>
                    <option value = "done">done</option>
                </select>
                <select  id = "taskPriority">
                    <option value = "low">low</option>
                    <option value = "medium">medium</option>
                    <option value = "high">high</option>
                </select>
                <button type = "submit" id="taskSubmit">Add Task</button>
                <div id = "tasksErrorDiv"></div>
            </form>
            <div id = "tasksContainer"></div>
        </section>
    </main>

    <script src="../js/projects.js"></script>
    <script src="../js/tasks.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
