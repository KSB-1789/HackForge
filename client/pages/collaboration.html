<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackForge - Collaboration</title>
    <link rel="stylesheet" href="../css/collaboration.css">
</head>
<body>

    <h1>HackForge Collaboration</h1>

    <section id="kanban">
        <h2>Kanban Board</h2>

        <div class="kanban-board">

            <div class="kanban-column">
                <h3>TODO</h3>
                <div id="todoTasks"></div>
            </div>

            <div class="kanban-column">
                <h3>IN PROGRESS</h3>
                <div id="inProgressTasks"></div>
            </div>

            <div class="kanban-column">
                <h3>DONE</h3>
                <div id="doneTasks"></div>
            </div>

        </div>
    </section>
    <script src="../js/tasks.js"></script>
    <script src="../js/kanban.js"></script>

</body>
</html>
