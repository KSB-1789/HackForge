<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackForge - Collaboration</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="../css/collaboration.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="topbar">
        <span class="brand">HackForge</span>
        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="team.html">Teams</a>
        </nav>
        <span class="user-info"></span>
        <button id="logoutBtn">Logout</button>
    </header>

    <div class="back-nav">
        <button id="backBtn">← Back to Project</button>
    </div>

    <main class="main">

    <header class="collab-header">
        <h2 id="projectName"></h2>
        <div id="progressSummary">
            <p><span id="completedTasks">0</span> / <span id="totalTasks">0</span> tasks completed · <span id="progressPercentage">0%</span></p>
            <div class="progress-bar">
                <div id="progressBarFill"></div>
            </div>
        </div>
    </header>

    <section id="kanban">
        <h2>Kanban Board</h2>

        <div class="kanban-board">

            <div class="kanban-column">
                <h3>TODO <span class="column-count" id="todoCount">0</span></h3>
                <div id="todoTasks"></div>
            </div>

            <div class="kanban-column">
                <h3>IN PROGRESS <span class="column-count" id="inProgressCount">0</span></h3>
                <div id="inProgressTasks"></div>
            </div>

            <div class="kanban-column">
                <h3>DONE <span class="column-count" id="doneCount">0</span></h3>
                <div id="doneTasks"></div>
            </div>

        </div>
    </section>

    <div class="chat-files-row">

    <section id="chat">
        <h2>Team Chat</h2>

        <div id="chatMessages"></div>

        <form id="chatForm">
            <input
                id="chatInput"
                type="text"
                placeholder="Type a message..."
                required
            >
            <button type="submit">Send</button>
        </form>
    </section>

    <section id="files">
        <h2>Project Files</h2>

        <form id="fileForm">
            <input id="fileInput" type="file" required>
            <button type="submit">Add File</button>
        </form>

        <div id="fileList"></div>
    </section>

    </div>

    </main>
    <script src="../js/projects.js"></script>
    <script src="../js/tasks.js"></script>
    <script src="../js/storage.js"></script>
    <script>loadTasks();</script>
    <script src="../js/kanban.js"></script>
    <script src="../js/progress.js"></script>
    <script src="../js/chat.js"></script>
    <script src="../js/files.js"></script>

</body>
</html>
